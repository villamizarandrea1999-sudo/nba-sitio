name: Update NBA Schedule Grid

on:
  schedule:
    # 08:37 UTC daily — off the hour on purpose, avoids the top-of-hour scheduler pile-up
    - cron: '37 8 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-grid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate schedule grid
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: node scripts/generate-schedule-grid.js

      - name: Commit and push if changed
        run: |
          git config user.name "nba-grid-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- blog/nba-fantasy-schedule-grid/index.html; then
            echo "No schedule changes today."
          else
            git add blog/nba-fantasy-schedule-grid/index.html
            git commit -m "chore: nightly NBA schedule grid update"
            git push
          fi
