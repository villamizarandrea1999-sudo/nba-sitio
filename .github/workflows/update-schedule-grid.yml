name: Update NBA Schedule Grid

on:
  schedule:
    # 08:37 UTC daily — off the hour on purpose, avoids the top-of-hour scheduler pile-up
    - cron: '37 8 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-grid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate schedule grid
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: node scripts/generate-schedule-grid.js

      - name: Generate standings
        run: node scripts/generate-standings.js

      - name: Generate NBA Today
        run: node scripts/generate-nba-today.js

      - name: NBA GRID daily answers page
        run: node scripts/nba-3x3/build-pages.js

      - name: Sync sitemap lastmod
        run: node scripts/sync-sitemap-lastmod.js

      - name: Commit and push if changed
        run: |
          git config user.name "nba-grid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A blog/nba-fantasy-schedule-grid nba-standings nba-today nba-grid sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "chore: nightly schedule grid, standings, NBA Today and NBA GRID answers"
            git push
          fi
